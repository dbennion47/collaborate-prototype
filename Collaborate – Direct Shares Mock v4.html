/* === Additions: security strip, three-dot === */
.sec-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 22px 12px;background:#f5f9fc;border-top:1px solid var(--line)}
.sec-strip.owner{cursor:pointer;transition:background .12s}
.sec-strip.owner:hover{background:#eaf3fa}
.sec-edit-btn{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:0;margin-left:auto;cursor:pointer;white-space:nowrap}
.sec-edit-btn:hover{text-decoration:underline}
.sec-set-by{margin-left:auto;font-size:12px;color:var(--muted)}
/* three-dot */
.tdw{position:relative;display:inline-block}
.tdw-btn{border:0;background:transparent;color:var(--muted);font-size:16px;padding:4px 9px;border-radius:6px;cursor:pointer;letter-spacing:.06em;line-height:1}
.tdw-btn:hover{background:#eef5fa;color:var(--navy)}
.tdw-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px rgba(14,35,55,.14);min-width:130px;overflow:hidden}
.tdw-menu[hidden]{display:none}
.tdw-item{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);border:0;background:none;font-family:inherit}
.tdw-item:hover{background:#f5f9fd}
.tdw-item.danger{color:#912840}
.tdw-item.danger:hover{background:#fdf2f4}
/* security modal switch-line override so first has a border */
.sec-switch-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sec-switch-line strong{font-size:14px}

.sec-switch-line input{width:18px;height:18px;accent-color:var(--navy)}

function icon(name, size=22){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true">${paths[name]||paths.files}</svg>`; }
function escapeHtml(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sizeLabel(n){ if(!n)return 'Demo file'; return n>1048576?`${(n/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(n/1024))} KB`; }
function fileKind(name){ const ext=(name.split('.').pop()||'').toLowerCase(); return ({pdf:'PDF',xlsx:'Excel',xls:'Excel',docx:'Word',doc:'Word',pptx:'Presentation',zip:'Archive'})[ext]||'File'; }
function isOffice(name){ return /\.(docx?|xlsx?|pptx?)$/i.test(name); }
function today(){ return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function loadData(){ try { const s=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(s?.files&&s?.threads&&s?.workspaces) return s; } catch{} return structuredClone(seed); }

const views=['explore','workspaces','direct','files','history'];
const state={view:views.includes(location.hash.slice(1))?location.hash.slice(1):'direct',threadId:'t1',workspaceId:'w1',search:'',draft:'',modal:null,form:null,toastTimer:null};
function persist(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }
function notify(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>el.classList.remove('show'),3600); }
function navigate(view){ state.view=view; location.hash=view; render(); document.getElementById('main').focus(); }

function renderNavigation(){
  const labels={explore:'Explore',workspaces:'Workspaces',direct:'Direct Shares',files:'My Files',history:'History'};
  document.getElementById('navigation').innerHTML=`<div class="nav-list">${views.map(v=>`<button class="nav-item ${state.view===v?'active':''} ${['direct','files'].includes(v)?'compact':''}" type="button" data-action="nav" data-view="${v}" title="${labels[v]}">${icon(v)}<span class="nav-label">${labels[v]}</span></button>`).join('')}</div>`;
}

// ── SECURITY STRIP ──────────────────────────────────────────────
function renderSecurityStrip(thread){
  const s=thread.security||{};
  let dlIcon='download'; let dlColor='';
  if(s.download==='Secure Download'){dlIcon='lock';}
  else if(s.download==='View Only'){dlIcon='eye';}
  const pills=[];
  pills.push(`<span class="pill">${icon(dlIcon,13)} ${escapeHtml(s.download||'Open Download')}</span>`);
  if(s.expiry) pills.push(`<span class="pill teal">${icon('clock',13)} Expires ${escapeHtml(s.expiry)}</span>`);
  if(s.watermark) pills.push(`<span class="pill magenta">${icon('watermark',13)} Watermark</span>`);
  const right=s.isOwner
    ?`<button class="sec-edit-btn" data-action="edit-security" data-id="${escapeHtml(thread.id)}">Edit settings ›</button>`
    :`<span class="sec-set-by">Set by ${escapeHtml(s.setBy||thread.name)}</span>`;
  return `<div class="sec-strip${s.isOwner?' owner':''}"${s.isOwner?' data-action="edit-security" data-id="'+escapeHtml(thread.id)+'"':''}>${pills.join('')}${right}</div>`;
}

// ── FILE CARD (simplified, security-aware) ──────────────────────
function fileCard(name, thread, incoming=false){
  const known=data.files.find(f=>f.name===name);
  const s=thread.security||{};
  const canDownload=s.download!=='View Only';
  const canEdit=canDownload&&isOffice(name);
  const showSave=incoming&&!known;
  return `<div class="file-attachment">
    <div style="display:flex;gap:11px;align-items:center">
      <span class="file-symbol">${icon('files',27)}</span>
      <div><strong>${escapeHtml(name)}</strong><small>${escapeHtml(known?.size||fileKind(name))}</small></div>
    </div>
    <div class="file-actions">
      <button class="primary" data-action="preview-file" data-file="${escapeHtml(name)}">Open</button>
      ${canEdit?`<button class="secondary" data-action="edit-file" data-file="${escapeHtml(name)}">Edit</button>`:''}
      ${canDownload?`<button class="secondary" data-action="download-file">Download</button>`:''}
      ${showSave?`<button class="secondary" data-action="save-received-file" data-file="${escapeHtml(name)}" data-thread="${escapeHtml(thread.id)}">Save to My Files</button>`:''}
    </div>
  </div>`;
}

function renderMessage(m, thread){
  const self=m.by==='You';
  return `<div class="message${self?' self':''}">
    <div class="msg-avatar${self?'':' '+thread.tone}">${self?'DB':escapeHtml(thread.initials)}</div>
    <div class="message-content">
      <div class="message-meta">${escapeHtml(m.by)}<span>${escapeHtml(m.time)}</span></div>
      ${m.text?`<div class="bubble">${escapeHtml(m.text)}</div>`:''}
      ${(m.files||[]).map(name=>fileCard(name,thread,!self)).join('')}
    </div>
  </div>`;
}

function renderDirect(){

            <span class="thread-preview">${escapeHtml(x.preview)}</span>
          </span>
          ${x.unread?'<span class="thread-unread"></span>':''}
        </button>`).join('') : '<div class="empty" style="margin:12px;padding:14px">No results.</div>'}
      </div>
      <div class="thread-context">Messages and files stay encrypted end-to-end.</div>
    </aside>
    <section class="conversation">
      <div class="conversation-head">
        <div class="conversation-head-main">
          <span class="thread-avatar ${t.tone}">${escapeHtml(t.initials)}</span>
          <div>
            <h2>${escapeHtml(t.name)}</h2>
            <p>${escapeHtml(t.email)} · ${t.messages.reduce((n,m)=>n+(m.files||[]).length,0)} files shared</p>
          </div>
        </div>
        ${renderSecurityStrip(t)}
      </div>
      <div class="messages" id="messages">
        <div class="date-divider">Protected conversation</div>
        ${t.messages.map(m=>renderMessage(m,t)).join('')}

    </section>
  </div>`;
}

  return `<div class="page-head"><div><h1 class="page-title">History</h1><p class="page-subtitle">Recent actions in this prototype.</p></div></div>
  <div class="workspace-detail"><h2>Activity</h2>
    ${data.activity.map((a,i)=>`<p style="padding:12px 0;border-bottom:1px solid var(--line);margin:0">${icon('history',17)} ${escapeHtml(a)} <span class="muted tiny" style="float:right">${i===0?'Today':'Earlier'}</span></p>`).join('')}
  </div>`;
}

function renderMain(){
  document.getElementById('main').innerHTML=({explore:renderExplore,workspaces:renderWorkspaces,direct:renderDirect,files:renderFiles,history:renderHistory})[state.view]?.();
  if(state.view==='direct'){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight;}
}

// ── MODALS ─────────────────────────────────────────────────────
function modalShell(title,subtitle,body,footer,wide=false){
  return `<div class="backdrop" data-action="close-backdrop"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div></div>`;
}
function fileChoices(selected){
  return `<div class="file-select-list">${data.files.map(f=>`<label class="select-row"><input type="checkbox" data-field="file-choice" value="${escapeHtml(f.name)}"${selected.includes(f.name)?' checked':''}/><span class="file-symbol">${icon('files',18)}</span><span class="grow">${escapeHtml(f.name)}</span><small>${escapeHtml(f.size)}</small></label>`).join('')}</div>`;
}

        <div class="destination-label" style="margin-top:12px">Workspaces</div>
        ${data.workspaces.map(w=>`<label class="select-row"><input type="checkbox" data-field="destination" value="${w.id}"${(f.destinations||[]).includes(w.id)?' checked':''}/>${icon('workspaces',20)}<span class="grow">${escapeHtml(w.name)}</span><small>Workspace</small></label>`).join('')}
      </div>`,
      `<span class="tiny muted">${(f.destinations||[]).length} selected</span><div class="actions"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" data-action="confirm-add-to"${(f.destinations||[]).length?'':' disabled'}>Add Copy</button></div>`);
  }

  // ── FILE PREVIEW ──
  else if(state.modal==='preview'){
    root.innerHTML=modalShell(escapeHtml(f.file),'Protected file — content not stored in this prototype',

      `<span></span><button class="primary" data-action="close-modal">Done</button>`);

  // ── NEW WORKSPACE ──
  else if(state.modal==='new-workspace'){

      `<span></span><div class="actions"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" data-action="create-workspace">Create</button></div>`);

  // ── ADD FILES TO WORKSPACE ──

      `<div class="field"><span class="field-label">Choose from My Files</span>${fileChoices(f.files||[])}<small style="margin-top:5px">A protected copy is added to the workspace. Your original stays in My Files.</small></div>`,
      `<span class="tiny muted">${(f.files||[]).length} selected</span><div class="actions"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" data-action="confirm-workspace-files"${(f.files||[]).length?'':' disabled'}>Add Files</button></div>`);

  // ── SETTINGS ──

function render(){ renderNavigation(); renderMain(); renderModal(); }
function closeModal(){ state.modal=null; state.form=null; renderModal(); }
function openNewShare(file){ state.modal='new-share'; state.form={recipients:[],message:'',files:file?[file]:[],uploads:[],tab:'mine'}; renderModal(); setTimeout(()=>document.getElementById('recipient-input')?.focus(),50); }
function openAddFiles(){ const t=data.threads.find(x=>x.id===state.threadId); state.modal='add-files'; state.form={thread:t,files:[],uploads:[],tab:'mine'}; renderModal(); }
function openAddTo(file){ state.modal='add-to'; state.form={file,destinations:[]}; renderModal(); }
function addActivity(msg){ data.activity.unshift(msg); data.activity=data.activity.slice(0,30); }

// ── EVENT DELEGATION ───────────────────────────────────────────
document.addEventListener('click', event => {
  // Close three-dot menus when clicking outside
  if(!event.target.closest('.tdw')) document.querySelectorAll('.tdw-menu').forEach(m=>{ m.hidden=true; });

  const target=event.target.closest('[data-action]');
  if(!target) return;
  const action=target.dataset.action;

  if(action==='close-backdrop'){ if(event.target===target) closeModal(); return; }
  if(action==='nav'){ navigate(target.dataset.view); return; }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='settings'){ state.modal='settings'; renderModal(); return; }
  if(action==='go-direct'){ state.threadId=target.dataset.id; navigate('direct'); return; }

  // Direct share list
  if(action==='select-thread'){
    state.threadId=target.dataset.id; state.draft='';
    const t=data.threads.find(x=>x.id===state.threadId);
    if(t) t.unread=false;
    persist(); renderMain(); return;
  }
  if(action==='new-share'){ openNewShare(); return; }
  if(action==='share-file'){ openNewShare(target.dataset.file); return; }
  if(action==='add-to-file'){ openAddTo(target.dataset.file); return; }
  if(action==='add-files-thread'){ openAddFiles(); return; }
  if(action==='new-request'){ state.modal='new-request'; state.form={}; renderModal(); setTimeout(()=>document.getElementById('request-recipient')?.focus(),50); return; }

  // Security
  if(action==='edit-security'){
    const id=target.dataset.id;
    const thread=data.threads.find(t=>t.id===id);
    if(!thread?.security?.isOwner) return;
    state.modal='edit-security'; state.form={threadId:id}; renderModal(); return;
  }
  if(action==='save-security'){
    const thread=data.threads.find(t=>t.id===state.form.threadId);
    if(!thread) return;
    const expVal=document.getElementById('sec-expiry').value;
    thread.security.expiry=expVal||null;
    thread.security.download=document.getElementById('sec-download').value;
    thread.security.watermark=document.getElementById('sec-watermark').checked;
    addActivity(`Security updated for ${thread.name}`);
    persist(); closeModal(); renderMain(); notify('Security settings updated.'); return;
  }

  // Three-dot menu
  if(action==='toggle-tdw'){
    event.stopPropagation();
    const id=target.dataset.tdw;
    const menu=document.getElementById(id);
    if(!menu) return;
    const wasHidden=menu.hidden;
    document.querySelectorAll('.tdw-menu').forEach(m=>{ m.hidden=true; });
    menu.hidden=!wasHidden;
    return;
  }
  if(action==='delete-file'){
    data.files=data.files.filter(f=>f.id!==target.dataset.id);
    document.querySelectorAll('.tdw-menu').forEach(m=>{ m.hidden=true; });
    persist(); renderMain(); notify('File removed from My Files.'); return;
  }
  if(action==='rename-file'){ document.querySelectorAll('.tdw-menu').forEach(m=>{ m.hidden=true; }); notify('Rename is simulated in this prototype.'); return; }

  // File actions
  if(action==='preview-file'){ state.modal='preview'; state.form={file:target.dataset.file}; renderModal(); return; }
  if(action==='edit-file'){ notify('Secure editing would open the file in the browser via a WOPI integration.'); return; }
  if(action==='download-file'){ notify('Download is simulated; this prototype stores no file content.'); return; }
  if(action==='save-received-file'){
    const thread=data.threads.find(t=>t.id===target.dataset.thread);
    const name=target.dataset.file;
    if(!thread||data.files.some(f=>f.name===name)){ notify('Already in My Files.'); return; }
    data.files.unshift({id:`f${Date.now()}`,name,size:'Demo file',added:today(),owner:thread.name});
    addActivity(`${name} saved to My Files from ${thread.name}`);
    persist(); renderMain(); notify('Saved to My Files.'); return;
  }

  // Send reply
  if(action==='send-reply'){
    const text=state.draft.trim(); if(!text){ notify('Write a message first.'); return; }
    const t=data.threads.find(x=>x.id===state.threadId);
    t.messages.push({by:'You',time:today(),text,files:[]});
    t.preview=`You: ${text}`; t.time='Now'; state.draft='';
    addActivity(`Message sent to ${t.name}`); persist(); renderMain(); notify('Message sent.'); return;
  }

  // Modal actions
  if(action==='modal-tab'){ state.form.tab=target.dataset.tab; renderModal(); return; }
  if(action==='remove-recipient'){ state.form.recipients.splice(Number(target.dataset.index),1); renderModal(); return; }

  if(action==='create-share'){
    const f=state.form; const input=document.getElementById('recipient-input');
    if(input?.value.trim()) f.recipients.push(input.value.trim());
    f.recipients=[...new Set(f.recipients)];
    if(!f.recipients.length){ notify('Add at least one recipient.'); return; }
    if(f.recipients.some(r=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r))){ notify('Check recipient email addresses.'); return; }
    const allFiles=[...f.files,...(f.uploads||[]).map(x=>x.name)];
    if(!f.message.trim()&&!allFiles.length){ notify('Add a message or file.'); return; }
    const expiry=document.getElementById('ns-expiry')?.value||'';
    const download=document.getElementById('ns-download')?.value||'Secure Download';
    const watermark=document.getElementById('ns-watermark')?.checked||false;
    (f.uploads||[]).forEach(x=>{ if(!data.files.some(y=>y.name===x.name)) data.files.unshift({id:`f${Date.now()}${Math.random()}`,name:x.name,size:x.size,added:today(),owner:'You'}); });
    const id=`t${Date.now()}`;
    const name=f.recipients.length===1?f.recipients[0].split('@')[0].replace(/[._-]/g,' '):`${f.recipients[0].split('@')[0]} +${f.recipients.length-1}`;
    data.threads.unshift({id,name,email:f.recipients.join(', '),initials:name.slice(0,2).toUpperCase(),tone:'light',preview:allFiles[0]||`You: ${f.message}`,time:'Now',unread:false,
      security:{expiry:expiry||null,download,watermark,isOwner:true},
      messages:[{by:'You',time:today(),text:f.message.trim(),files:allFiles}]});
    state.threadId=id; state.draft='';
    addActivity(`New Direct Share created with ${name}`); persist(); closeModal(); navigate('direct'); notify('Direct Share created.'); return;
  }

  if(action==='confirm-add-files'){
    const f=state.form; const files=[...f.files,...(f.uploads||[]).map(x=>x.name)];
    if(!files.length){ notify('Select at least one file.'); return; }
    (f.uploads||[]).forEach(x=>{ if(!data.files.some(y=>y.name===x.name)) data.files.unshift({id:`f${Date.now()}${Math.random()}`,name:x.name,size:x.size,added:today(),owner:'You'}); });
    f.thread.messages.push({by:'You',time:today(),text:'',files});
    f.thread.preview=files[files.length-1]; f.thread.time='Now';
    addActivity(`${files.length} file(s) added to ${f.thread.name}`);
    persist(); closeModal(); renderMain(); notify('Files added to the conversation.'); return;
  }

  if(action==='create-request'){
    const recipient=document.getElementById('request-recipient')?.value.trim();
    const subject=document.getElementById('request-subject')?.value.trim();
    const note=document.getElementById('request-note')?.value.trim();
    if(!recipient||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient)){ notify('Enter a valid recipient email.'); return; }
    const id=`t${Date.now()}`;
    const name=recipient.split('@')[0].replace(/[._-]/g,' ');
    data.threads.unshift({id,name,email:recipient,initials:name.slice(0,2).toUpperCase(),tone:'light',
      preview:'File request sent',time:'Now',unread:false,
      security:{expiry:null,download:'Secure Download',watermark:false,isOwner:true},
      request:{subject,note,files:[]},
      messages:[{by:'You',time:today(),text:`Requesting files${subject?': '+subject:''}${note?' — '+note:''}`,files:[]}]});
    state.threadId=id; addActivity(`Files requested from ${recipient}`);
    persist(); closeModal(); navigate('direct'); notify('Request created. No email sent in prototype.'); return;
  }

  if(action==='confirm-add-to'){
    const f=state.form; if(!f.destinations?.length) return;
    for(const id of f.destinations){
      const t=data.threads.find(x=>x.id===id);
      if(t){ t.messages.push({by:'You',time:today(),text:'',files:[f.file]}); t.preview=f.file; t.time='Now'; continue; }
      const w=data.workspaces.find(x=>x.id===id);
      if(w&&!w.files.includes(f.file)) w.files.push(f.file);
    }
    addActivity(`${f.file} added to ${f.destinations.length} destination(s)`);
    persist(); closeModal(); renderMain(); notify(`Copy added to ${f.destinations.length} destination(s).`); return;
  }

  if(action==='open-workspace'){ state.workspaceId=target.dataset.id; navigate('workspaces'); return; }
  if(action==='new-workspace'){ state.modal='new-workspace'; state.form={workspaceName:''}; renderModal(); setTimeout(()=>document.getElementById('workspace-name')?.focus(),50); return; }
  if(action==='create-workspace'){
    const name=state.form.workspaceName.trim(); if(!name){ notify('Enter a workspace name.'); return; }
    const id=`w${Date.now()}`;
    data.workspaces.push({id,name,members:1,files:[],note:'New secure workspace.',badge:'Active'});
    state.workspaceId=id; addActivity(`Workspace "${name}" created`);
    persist(); closeModal(); renderMain(); notify('Workspace created.'); return;
  }
  if(action==='add-files-workspace'){
    const w=data.workspaces.find(x=>x.id===target.dataset.id);
    if(w){ state.modal='workspace-files'; state.form={workspace:w,files:[]}; renderModal(); } return;
  }
  if(action==='confirm-workspace-files'){
    const f=state.form; if(!f.files.length) return;
    for(const name of f.files) if(!f.workspace.files.includes(name)) f.workspace.files.push(name);
    addActivity(`${f.files.length} file(s) added to ${f.workspace.name}`);
    persist(); closeModal(); renderMain(); notify('Files added to the workspace.'); return;
  }
  if(action==='reset-demo'){ data=structuredClone(seed); persist(); state.threadId='t1'; state.workspaceId='w1'; closeModal(); render(); notify('Demo data reset.'); }
});

document.addEventListener('input', event => {
  const el=event.target;
  if(el.id==='reply'){ state.draft=el.value; return; }
  if(el.id==='share-search'){
    const pos=el.selectionStart; state.search=el.value; renderMain();
    const next=document.getElementById('share-search'); next?.focus(); next?.setSelectionRange(pos,pos); return;
  }
  if(el.dataset.field==='message') state.form.message=el.value;
  if(el.dataset.field==='workspaceName') state.form.workspaceName=el.value;
});

document.addEventListener('change', event => {
  const el=event.target;
  if(el.id==='my-file-upload'){
    for(const file of el.files||[]){
      data.files.unshift({id:`f${Date.now()}${Math.random()}`,name:file.name,size:sizeLabel(file.size),added:today(),owner:'You'});
      addActivity(`${file.name} uploaded to My Files`);
    }
    persist(); renderMain(); notify('File names added to My Files.'); return;
  }
  if(el.id==='new-share-upload'||el.id==='add-file-upload'){
    state.form.uploads=[...state.form.uploads||[],...[...el.files].map(f=>({name:f.name,size:sizeLabel(f.size)}))];
    renderModal(); return;
  }
  if(!state.form) return;
  if(el.dataset.field==='file-choice'){
    const arr=state.form.files=state.form.files||[];
    el.checked?arr.push(el.value):arr.splice(arr.indexOf(el.value),1); renderModal(); return;
  }
  if(el.dataset.field==='destination'){
    const arr=state.form.destinations=state.form.destinations||[];
    el.checked?arr.push(el.value):arr.splice(arr.indexOf(el.value),1); renderModal(); return;
  }
});

document.addEventListener('keydown', event => {
  if(event.key==='Escape'&&state.modal){ closeModal(); return; }
  if(event.target.id==='recipient-input'&&['Enter',','].includes(event.key)){
    event.preventDefault();
    const v=event.target.value.trim().replace(/,$/,'');
    if(!v) return;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ notify('Enter a valid email.'); return; }
    if(!state.form.recipients.includes(v)) state.form.recipients.push(v);
    renderModal(); setTimeout(()=>document.getElementById('recipient-input')?.focus(),30);
  }
  if((event.key==='Enter'||event.key===' ')&&event.target.matches('.workspace-card')){ event.preventDefault(); event.target.click(); }
});

document.getElementById('sidebar-collapse').addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('collapsed'));
document.getElementById('theme-toggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); notify(document.body.classList.contains('dark')?'Dark mode on.':'Light mode on.'); });
window.addEventListener('hashchange',()=>{ const next=location.hash.slice(1); if(views.includes(next)&&next!==state.view){state.view=next;render();} });

render();
</script>
</body>
</html>
